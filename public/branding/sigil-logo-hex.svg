<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hex seal — modern, angular, blockchain-forward -->
  <polygon points="50,4 88,26 88,74 50,96 12,74 12,26" fill="#0D1B5E"/>
  <polygon points="50,4 88,26 88,74 50,96 12,74 12,26" fill="none" stroke="#34D6C2" stroke-width="2"/>
  <polygon points="50,11 82,30 82,70 50,89 18,70 18,30" fill="none" stroke="#FACC15" stroke-width="0.8" opacity="0.5"/>

  <!-- S as two interlocking angular cuts, negative-space feel -->
  <path d="M 66 30 L 38 30 L 38 50 L 62 50 L 62 70 L 34 70"
        fill="none" stroke="white" stroke-width="6.5" stroke-linejoin="miter" stroke-linecap="square" stroke-miterlimit="10"/>

  <!-- Yellow accent node at top vertex -->
  <circle cx="50" cy="11" r="2.2" fill="#FACC15"/>
  <circle cx="82" cy="30" r="1.6" fill="#34D6C2"/>
  <circle cx="18" cy="30" r="1.6" fill="#34D6C2"/>
</svg>

name: CI

# Validates every push/PR before it can ship — lint, typecheck, build, and
# the translation test suite. This does NOT deploy anything; it only
# catches broken code before a human runs bin/deploy-webmail.sh against the
# live Hetzner box. See OPERATIONS.md "Deploying webmail changes".

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Translation tests
        run: npm run test:translations

      - name: Build
        run: npm run build
